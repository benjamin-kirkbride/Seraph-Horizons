# Mergify merge queue (docs/merge-queue.md).
#
# Injection mode "merge": whatever the ruleset on main requires is checked
# only at merge time, against the queue's temporary PR. What a PR needs to
# enter the queue, and to merge, is spelled out explicitly below.
#
# The merge button is kept out of use by that ruleset, not by Mergify: it
# restricts updates to main and lists Mergify as an exempt bypass actor. A
# merge protection cannot do this job. Mergify requires every active
# protection to pass before it will queue a PR, so a protection such as
# `queue-position >= 0` can never pass and nothing enters the queue.

merge_queue:
  # Speculative checks: with PRs A, B, C queued, Mergify opens temporary
  # draft PRs for main+A, main+A+B and main+A+B+C at once (branches
  # mergify/merge-queue/*), so the whole queue is tested in one CI
  # wall-clock instead of one per PR. If A fails, B and C are re-tested
  # without it. 3 = one hosted-runner CI run each, in parallel.
  max_parallel_checks: 3

queue_rules:
  - name: default
    branch_protection_injection_mode: merge
    queue_conditions:
      - base = main
      # ci-ok is the aggregate of every job in ci.yml.
      - check-success = ci-ok
    # The queue's temporary PR (main + everything queued ahead + this PR)
    # must pass ci-ok. The ruleset requires it too, but Mergify is exempt
    # from that ruleset, so the condition is stated here as well.
    merge_conditions:
      - check-success = ci-ok
    # A merge commit per PR (what the merge button did before).
    merge_method: merge
    # One PR per temporary PR: a failure points at exactly one PR. Raise
    # for batching if the queue gets deep.
    batch_size: 1

pull_request_rules:
  - name: queue a labelled pull request
    conditions:
      - base = main
      - label = queue
      - -draft
    actions:
      queue:

