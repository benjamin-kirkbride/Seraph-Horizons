# Every push to main that passes CI republishes the rolling `next` pre-release,
# whatever pack.toml's and modinfo.json's versions are, in one `gh release create`:
#   - the pack, the dist/ artifact that CI's cairn job built and installed, its files
#     named for next rather than the version (seraphhorizons_next.cairn,
#     seraphhorizons_next_server.zip, ..., and the recipe export added below);
#   - the pack's own mod (mods-src/seraphhorizons), the zip that job built from
#     that commit, seraphhorizons_next_<sha7>.zip, which the pack's .cairn fetches
#     from this same release by address and holds to that zip's sha256. Only the
#     current build's zip is on the release: a follower whose Cairn still has the
#     previous pack document gets the new pack when it syncs, which it does on launch.
# So what ships is exactly what was tested, and the zip appears at its address in
# the same publish as the pack naming it. Versioned releases are release.yml's (the
# pack and its own mod, together) and mod-release.yml's (the other mods-src mods)
# job and are not touched. The mod used to have a rolling release of its own,
# seraphhorizons-next; the last step removes it, and is a no-op once it is gone.
name: Next release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One publish at a time, never cancelled half-way through replacing the releases.
concurrency:
  group: next-release
  cancel-in-progress: false

jobs:
  next:
    # workflow_run also fires for PRs whose head branch is called main.
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      # CI runs for two pushes can finish out of order. Only ever move forward.
      - name: Skip if next is already ahead of this commit
        id: order
        run: |
          if git rev-parse -q --verify refs/tags/next >/dev/null \
             && ! git merge-base --is-ancestor refs/tags/next "$SHA"; then
            echo "next ($(git rev-parse --short refs/tags/next)) is not an ancestor of ${SHA::7}; leaving it alone" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the dist artifact CI tested
        if: steps.order.outputs.publish == 'true'
        run: gh run download "$RUN_ID" --name dist --dir dist
      - name: Add the recipe export CI dumped
        if: steps.order.outputs.publish == 'true'
        run: |
          gh run download "$RUN_ID" --name recipe-export --dir "$RUNNER_TEMP/recipe-export"
          f="$(jq -r .pack.id pack/lock.json)_next_recipes.json"
          cp "$RUNNER_TEMP/recipe-export/recipes.json" "dist/$f"
          (cd dist && sha256sum "$f" >> SHA256SUMS)
      # The zip keeps the version modinfo.json says, unstamped: the game ranks
      # 1.0.1-dev below 1.0.1, so a suffix would change which copy loads. Its file name
      # carries the commit instead (ci.yml's cairn job), so the pack's address for it
      # changes with every build and Cairn re-downloads it. The pack's Cairn file must
      # name it at the address it is about to be published to, by the hash it has;
      # anything else would publish a pack that cannot install. That address is in
      # this release, next, which the publish below creates with the zip and the pack
      # together.
      - name: Download the mod zip CI built, and check the pack names it
        id: mod
        if: steps.order.outputs.publish == 'true'
        run: |
          version=$(jq -r .version mods-src/seraphhorizons/modinfo.json)
          zip="seraphhorizons_next_${SHA::7}.zip"
          gh run download "$RUN_ID" --name seraphhorizons-mod --dir mod
          [ -f "mod/$zip" ] || { echo "CI's seraphhorizons-mod artifact has no $zip:"; ls mod; exit 1; }
          cairn="dist/$(jq -r .pack.id pack/lock.json)_next.cairn"
          [ -f "$cairn" ] || { echo "CI's dist artifact has no $cairn:"; ls dist; exit 1; }
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/next/$zip"
          [ "$(jq -r '.pack.mods[] | select(.modid == "seraphhorizons") | .url' "$cairn")" = "$url" ] \
            || { echo "$cairn does not fetch seraphhorizons from $url"; exit 1; }
          [ "$(jq -r '.lock.mods[] | select(.modid == "seraphhorizons") | .sha256' "$cairn")" = "$(sha256sum < "mod/$zip" | cut -d' ' -f1)" ] \
            || { echo "$cairn locks seraphhorizons to another hash than $zip's"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
      # dist/ has its own SHA256SUMS (assemble, and the export above); the zips join it.
      # Their names carry a commit, so they never collide with the pack's own
      # seraphhorizons_next_server.zip, but say so if they ever did.
      - name: Add the mod zips to the release files
        if: steps.order.outputs.publish == 'true'
        run: |
          for z in mod/*.zip; do
            n=${z##*/}
            [ ! -e "dist/$n" ] || { echo "dist/ already has a $n"; exit 1; }
            mv "$z" dist/
            (cd dist && sha256sum "$n" >> SHA256SUMS)
          done
          cat dist/SHA256SUMS
      - name: Release notes
        if: steps.order.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.mod.outputs.version }}
          ZIP: ${{ steps.mod.outputs.zip }}
        run: |
          game=$(jq -r .pack.game_version pack/lock.json)
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$SHA" 2>/dev/null || true)
          {
            echo "Rolling build of \`main\` at $SHA. Replaced on every merge; use a versioned release for something that stays put."
            echo
            echo "Pack version: **$(jq -r .pack.version pack/lock.json)** · Game version: **$game**"
            echo
            echo "The Cairn pack also carries the pack's own mod, Seraph Horizons $VERSION built from this commit (built against game $game; the mod requires $(jq -r .dependencies.game mods-src/seraphhorizons/modinfo.json) or later), as \`$ZIP\` in this release, which it fetches by address and checks against its sha256. The mod list and the table below name the ModDB mods only. The files are named \`next\` where a versioned release has its version; what is in them carries the version."
            echo
            echo "\`$ZIP\` carries the version modinfo.json says, unstamped, the same as the $VERSION release: with two copies of one modid at one version the game may load either, so replace any other copy of the mod rather than adding this one next to it. The \`_${SHA::7}\` in its name is the commit it was built from, so the Cairn pack's address for it changes with every build."
            echo
            echo "| mod | version | license |"
            echo "|---|---|---|"
            jq -r '.mods[] | "| [\(.id)](https://mods.vintagestory.at/\(.id)) | \(.version) | \(.license) |"' pack/lock.json
            if [ -n "$prev" ]; then
              echo; echo "### Changes since $prev"; echo
              diff <(git show "$prev:pack/lock.json" | jq -r '.mods[] | "\(.id) \(.version)"' | sort) \
                   <(jq -r '.mods[] | "\(.id) \(.version)"' pack/lock.json | sort) \
                | sed -n 's/^< /- removed /p; s/^> /- added /p' || true
              echo; echo "### Seraph Horizons mod changes since $prev"; echo
              git log --no-merges --format='- %s (%h)' "$prev..$SHA" -- mods-src/seraphhorizons
            fi
          } > "$RUNNER_TEMP/notes.md"
      # Delete and recreate rather than edit in place: that drops assets whose names
      # changed with the version or the commit, so only this build's zip stays, and moves
      # the tag to this commit. One create, so the pack and the zip it names appear
      # together.
      - name: Publish next
        if: steps.order.outputs.publish == 'true'
        run: |
          gh release delete next --cleanup-tag --yes 2>/dev/null || true
          gh release create next dist/* --target "$SHA" --prerelease \
            --title "Seraph Horizons next (${SHA::7})" --notes-file "$RUNNER_TEMP/notes.md"
      # The mod's own rolling release, which next's pack fetched the zip from before the
      # two were merged into next. Removed only after next is published without it, and
      # a no-op once it is gone.
      - name: Remove the retired seraphhorizons-next release
        if: steps.order.outputs.publish == 'true'
        env:
          OLD: seraphhorizons-next
        run: |
          if gh release view "$OLD" >/dev/null 2>&1; then
            gh release delete "$OLD" --cleanup-tag --yes
            echo "removed the $OLD release and its tag" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$OLD" >/dev/null; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$OLD"
            echo "removed the $OLD tag" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
