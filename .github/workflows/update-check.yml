# Nightly: ask the ModDB whether any locked mod has a newer release for the pinned
# game version, or was retracted. Findings go to a single tracking issue; bumping a
# pin is a normal PR (edit pack.toml, run `packtool.py lock`) so CI tests it.
name: Mod update check

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  outdated:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check ModDB
        id: check
        run: |
          set +e
          python3 tools/packtool.py outdated > "$RUNNER_TEMP/report.md"
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/report.md" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Mod updates available"
        run: |
          existing=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if grep -q '^|' "$RUNNER_TEMP/report.md"; then
            { echo "Nightly ModDB check for the pinned game version ($(date -u +%F))."; echo
              cat "$RUNNER_TEMP/report.md"; echo
              echo "To take an update: bump \`version\` in \`pack/pack.toml\`, run \`python3 tools/packtool.py lock\`, open a PR."
            } > "$RUNNER_TEMP/body.md"
            if [ -n "$existing" ]; then gh issue edit "$existing" --body-file "$RUNNER_TEMP/body.md"
            else gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"; fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "All locked mods are current."
          fi
      - name: Fail on retracted or missing releases
        if: steps.check.outputs.status != '0'
        run: exit 1
