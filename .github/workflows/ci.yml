# Every PR (including forks) and every push to main. Runs on GitHub-hosted runners
# only and needs no secrets: game and mod downloads are unauthenticated.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Memo (docs/merge-queue.md): smoke, atlas, cairn and tools are a function
  # of the tree, and a passing pull_request run records its tree's id
  # (ci/code-tree.sh) as refs/green-trees/<id>. If this tree's id is already
  # on record there is nothing to learn from running them again. This is what
  # makes the merge queue cheap: the queue's temporary PR (main + everything
  # queued ahead + the PR) has exactly the tree the PR's own run tested
  # whenever the PR is built on the current main and queued alone, so the
  # queue merges on the PR's own result.
  #
  # A push to main consults the memo too, but only to skip the test-only jobs
  # (atlas, tools, site): smoke, cairn and export still run, because next.yml
  # publishes the dist, seraphhorizons-mod and recipe-export artifacts this run
  # produces. Tags and manual runs never consult it and run everything.
  tree:
    name: Already tested?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      id: ${{ steps.tree.outputs.id }}
      tested: ${{ steps.tree.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tree
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          id=$(ci/code-tree.sh HEAD)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          main_push=false
          [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && main_push=true
          if [ "$EVENT" != pull_request ] && [ "$main_push" != true ]; then
            echo "tested=false" >> "$GITHUB_OUTPUT"
            echo "tree $id: $EVENT on $REF runs everything"
          elif by=$(gh api "repos/$REPO/git/ref/green-trees/$id" --jq .object.sha 2>/dev/null); then
            echo "tested=true" >> "$GITHUB_OUTPUT"
            if [ "$EVENT" = pull_request ]; then skipped="smoke, atlas, cairn and tools"; else skipped="atlas, tools and site"; fi
            echo "tree $id already passed CI (as $by); skipping $skipped" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "tested=false" >> "$GITHUB_OUTPUT"
            echo "tree $id: no passing CI on record"
          fi

  # Never skipped by the memo: it is cheap, and `outdated` depends on the
  # ModDB rather than on the tree, so an old pass says nothing about today.
  lock:
    name: Lock is consistent
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: pack.toml and lock.json agree
        run: python3 tools/packtool.py check
      - name: Locked releases still available on the ModDB (not retracted)
        run: python3 tools/packtool.py outdated

  smoke:
    name: Server boot + worldgen smoke test
    needs: [tree, lock]
    # On a push to main these run even for a tree on record: next.yml publishes
    # the recipe export (smoke), and dist and the seraphhorizons mod zip (cairn),
    # this run uploads.
    if: needs.tree.outputs.tested != 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pack
      # --export also loads the CI-only export mod (tools/recipe-export), which dumps the
      # recipes and items the recipe browser shows. release.yml and next.yml publish it.
      - name: Boot dedicated server with the full pack
        run: >
          python3 tools/packtool.py smoke --data "$RUNNER_TEMP/smoke-data"
          --export "$RUNNER_TEMP/recipe-export/recipes.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recipe-export
          path: ${{ runner.temp }}/recipe-export/recipes.json
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-logs
          path: |
            ${{ runner.temp }}/smoke-data/Logs/
            ${{ runner.temp }}/smoke-data/smoke-stdout.log

  atlas:
    name: Atlas pack scenarios (${{ matrix.shard }})
    needs: [tree, lock]
    if: needs.tree.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Atlas runs one embedded server per process, so classes can only run in parallel as
    # separate jobs, and every class pays its own server boot (30-45 s), which is nearly all
    # of a shard's time. The item and recipe classes are the exception: each builds the pack's
    # export (over a minute) and fills parts of it again to compare, so each has a shard to
    # itself. `fixes` is the pack-authored *fix mods' classes and `tidy` is Tidy Variants',
    # both matched by name, so a new class of either kind joins its shard. `rest` is the
    # complement filter, so any other new class lands there without anyone having to list it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: items
            filter: FullyQualifiedName~.ItemExportScenarios.
          - shard: recipes
            filter: FullyQualifiedName~.RecipeExportScenarios.
          - shard: fixes
            filter: FullyQualifiedName~FixScenarios.
          - shard: tidy
            filter: FullyQualifiedName~.TidyVariants
          - shard: rest
            filter: FullyQualifiedName!~.ItemExportScenarios.&FullyQualifiedName!~.RecipeExportScenarios.&FullyQualifiedName!~FixScenarios.&FullyQualifiedName!~.TidyVariants
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pack
      # Local-only icon export mod (never shipped): keep it compiling, and test its logic.
      # Only on one shard, and not one of the longest (items, recipes).
      - name: Icon export mod builds and its unit tests pass
        if: matrix.shard == 'rest'
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
        run: |
          dotnet build tools/icon-export -c Release
          dotnet test tools/icon-export/tests --logger "console;verbosity=normal"
      # The game-independent code of the mods-src mods (Tidy Variants' rule engine,
      # mods-src/seraphhorizons/TidyVariants/Core; the bucking sawmill's BuckingSawmill/Core beside it):
      # unit tests that need no game. The mods themselves are built and loaded by the dotnet test
      # step below.
      - name: Seraph Horizons unit tests pass
        if: matrix.shard == 'rest'
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
        run: |
          dotnet test mods-src/seraphhorizons/tests --logger "console;verbosity=normal"
      - name: dotnet test
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
          FILTER: ${{ matrix.filter }}
          # TidyVariantsReportScenarios writes its report here, so it ships in atlas-results-tidy.
          TIDYVARIANTS_REPORT_DIR: ${{ runner.temp }}/atlas-results/tidyvariants
        run: >
          dotnet test tests/PackTests
          --filter "$FILTER"
          --logger "trx;LogFileName=atlas.trx"
          --logger "console;verbosity=normal"
          --results-directory "$RUNNER_TEMP/atlas-results"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/atlas-results/
      # Atlas keeps a failed class's scratch world (incl. server-main.log) under $TMPDIR/atlas.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-scratch-${{ matrix.shard }}
          path: /tmp/atlas/*/Logs/
          if-no-files-found: ignore

  cairn:
    name: Cairn installs the pack
    needs: [tree, lock]
    # Runs on main even for a tree on record; see smoke.
    if: needs.tree.outputs.tested != 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CAIRN_VERSION: "0.9.10"
      CAIRN_SHA256: b7a2b6359fb8c113e17854184c12b3a7703a26c784324152e17f5d84b850bf68
      CAIRN_HOME: /tmp/cairn-home
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # .NET and the game, to build the pack's own mod; also fetches the locked mods, which
      # assemble's server bundle takes its redistributable zips from.
      - uses: ./.github/actions/setup-pack
      # The pack's own mod as a release build makes it: build/seraphhorizons_<version>.zip,
      # the version modinfo.json says, never stamped. next.yml publishes this zip as the
      # seraphhorizons-next release, and the next Cairn pack below fetches it from there.
      - name: Build the seraphhorizons mod zip
        id: mod
        run: |
          dotnet build mods-src/seraphhorizons -c Release
          zip="build/seraphhorizons_$(jq -r .version mods-src/seraphhorizons/modinfo.json).zip"
          [ -f "$zip" ] || { echo "the build wrote no $zip"; exit 1; }
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
      # This dist is what next.yml publishes as next, so its Cairn pack carries the mod by
      # address (the URL is where next.yml puts this very zip; versioned releases assemble
      # their own dist without it, release.yml). Built the same on every run, PRs included,
      # so the install below tests what next ships.
      - name: Assemble release artifacts
        env:
          ZIP: ${{ steps.mod.outputs.zip }}
        run: >
          python3 tools/packtool.py assemble --url-mod "$ZIP"
          "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/seraphhorizons-next/${ZIP##*/}"
      # cairn-server is source-available (PolyForm Strict + a run-for-any-purpose grant);
      # we download and run it, never redistribute it.
      - name: Download cairn-server ${{ env.CAIRN_VERSION }}
        run: |
          f="cairn-${CAIRN_VERSION}-linux-x64-server.tar.gz"
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/$f" "https://download.cairns.gg/releases/${CAIRN_VERSION}/$f"
          echo "$CAIRN_SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cairn" && tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/cairn"
      # The mod's URL holds the previous commit's zip (or nothing) until next.yml publishes
      # this one, so the install reads a copy of the pack whose address-mods point at this
      # zip served on loopback, plain http to which Cairn allows. The copy differs from
      # dist/ in those addresses only; the lock, and so the hash Cairn holds the zip to, is
      # the one that ships.
      - name: cairn-server install (resolves, downloads, sha256-verifies every mod)
        env:
          ZIP: ${{ steps.mod.outputs.zip }}
        run: |
          id=$(jq -r .pack.id pack/lock.json); v=$(jq -r .pack.version pack/lock.json)
          port=8765
          python3 -m http.server "$port" --bind 127.0.0.1 --directory "$(dirname "$ZIP")" >/dev/null 2>&1 &
          srv=$!
          trap 'kill "$srv"' EXIT
          for _ in $(seq 50); do curl -fsI "http://127.0.0.1:$port/${ZIP##*/}" >/dev/null && break; sleep 0.2; done
          jq --arg base "http://127.0.0.1:$port/" \
            '.pack.mods |= map(if .url then .url = $base + (.url | split("/") | last) else . end)' \
            "dist/${id}_${v}.cairn" > "$RUNNER_TEMP/${id}.cairn"
          "$RUNNER_TEMP/cairn/cairn-server" install "$RUNNER_TEMP/${id}.cairn"
      - name: Cairn's lock matches ours, and the mod it fetched by address is this build
        env:
          ZIP: ${{ steps.mod.outputs.zip }}
        run: |
          id=$(jq -r .pack.id pack/lock.json); v=$(jq -r .pack.version pack/lock.json)
          # The pack file's lock is lock.json's mods with the address mods in place of any ModDB pin of the same modid (packtool tests).
          diff <(jq -S '[.lock.mods[] | {id: .modid, version, sha256}] | sort_by(.id)' "dist/${id}_${v}.cairn") \
               <(jq -S '[.mods[] | {id: .modid, version, sha256}] | sort_by(.id)' "$CAIRN_HOME/packs/$id/pack.lock.json")
          echo "$(sha256sum < "$ZIP" | cut -d' ' -f1)  $CAIRN_HOME/packs/$id/Mods/${ZIP##*/}" | sha256sum -c -
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
      # The zip dist's Cairn pack names by hash; next.yml publishes the two together.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seraphhorizons-mod
          path: ${{ steps.mod.outputs.zip }}
          if-no-files-found: error

  tools:
    name: Tool and site unit tests
    needs: tree
    if: needs.tree.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            tools/site-data/package-lock.json
            site/package-lock.json
      # The icon import tests need Pillow; without it they skip and prove nothing.
      - name: Python tool tests
        run: |
          python3 -m pip install --quiet pillow
          python3 -m unittest discover -s tools/tests -v
      # Works on the LFS pointer files this checkout has: no image is downloaded.
      - name: Icon index matches the icon files
        run: python3 tools/icons.py verify
      - name: tools/site-data
        run: |
          npm ci --prefix tools/site-data
          npm --prefix tools/site-data run typecheck
          npm --prefix tools/site-data test
      - name: site
        run: |
          npm ci --prefix site
          npm --prefix site run check
          npm --prefix site test

  export:
    name: Recipe export is valid
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/site-data/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recipe-export
          path: ${{ runner.temp }}/recipe-export
      - name: Export matches the schema and its cross-references hold
        run: |
          npm ci --prefix tools/site-data
          npm --prefix tools/site-data run build
          node tools/site-data/dist/bin.js validate "$RUNNER_TEMP/recipe-export/recipes.json"
      # Warns about items without an icon; never fails for them (the site shows placeholders).
      - name: Icon drift
        run: python3 tools/icons.py drift --export "$RUNNER_TEMP/recipe-export/recipes.json"

  site:
    name: Recipe browser end to end
    needs: [tree, smoke]
    # On a push to main smoke runs for its artifact alone; the site itself is
    # a function of the tree, so a tree on record skips this.
    if: needs.tree.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recipe-export
          path: ${{ runner.temp }}/recipe-export
      - run: npm ci --prefix site
      - run: npx --prefix site playwright install --with-deps chromium
      # Against the export this run's server dumped, not a fixture.
      - name: Playwright
        env:
          RECIPE_EXPORT: ${{ runner.temp }}/recipe-export/recipes.json
        run: npm --prefix site run e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-e2e
          path: |
            site/e2e/.work/results/
            site/playwright-report/
          if-no-files-found: ignore

  # Keeps the icons' LFS objects in the Actions cache for pages.yml. That
  # workflow is started by workflow_run, which gets a read-only cache, so it
  # cannot save one itself; without a cache every deploy downloads all the
  # icons, and each download counts against the LFS bandwidth quota. Here LFS
  # is touched only when icons/index.json has changed, and then only for the
  # icons that are new. Not in ci-ok: a cold cache costs bandwidth, not
  # correctness.
  icons:
    name: Icon cache for the site deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-icons-${{ hashFiles('icons/index.json') }}
          restore-keys: lfs-icons-
      - name: Fetch the icons the cache does not hold
        if: steps.cache.outputs.cache-hit != 'true'
        run: git lfs fetch origin "$GITHUB_SHA" --include "icons/**"

  # The one required status check (branch protection and .mergify.yml). A
  # needed job that fails leaves a plain `needs:` job *skipped*, and GitHub and
  # Mergify both read a skipped required check as passing, so this runs
  # always() and passes only if every job above succeeded. The one skip it
  # accepts is the memoised jobs standing down because `tree` found this tree
  # already on record as green (on a PR export needs smoke, so it is skipped
  # with it; on a push to main smoke, cairn and export still run).
  ci-ok:
    if: always()
    needs: [tree, lock, smoke, atlas, cairn, tools, export, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # contents: write is for the record step (a ref under refs/green-trees/,
    # nothing on any branch). release.yml grants it to its call of this
    # workflow for the same reason.
    permissions:
      contents: write
    steps:
      - name: Every CI job succeeded
        env:
          TREE: ${{ needs.tree.result }}
          LOCK: ${{ needs.lock.result }}
          MEMOISED: >-
            ${{ needs.smoke.result }} ${{ needs.atlas.result }} ${{ needs.cairn.result }}
            ${{ needs.tools.result }} ${{ needs.export.result }} ${{ needs.site.result }}
          TESTED: ${{ needs.tree.outputs.tested }}
        run: |
          echo "tree: $TREE (already tested: $TESTED), lock: $LOCK, smoke atlas cairn tools export site: $MEMOISED"
          [ "$TREE" = success ] && [ "$LOCK" = success ] || exit 1
          for r in $MEMOISED; do
            [ "$r" = success ] || { [ "$r" = skipped ] && [ "$TESTED" = true ]; } || exit 1
          done
      # Everything ran and passed: put this tree's id on record (the memo
      # `tree` reads). The ref points at the commit that was tested, on a
      # pull_request event GitHub's merge commit (refs/pull/N/merge), which
      # also keeps it around for auditing. "Reference already exists" (a
      # re-run, or another PR with the same tree got there first) is the same
      # outcome. Anything else is a warning, not a failure: a missed record
      # costs one redundant run, never a wrong merge. Fork PRs have a
      # read-only token and just don't record.
      - name: Record green tree
        if: github.event_name == 'pull_request' && needs.tree.outputs.tested != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ID: ${{ needs.tree.outputs.id }}
          SHA: ${{ github.sha }}
        run: |
          if out=$(gh api -X POST "repos/$REPO/git/refs" -f ref="refs/green-trees/$ID" -f sha="$SHA" 2>&1); then
            echo "recorded refs/green-trees/$ID -> $SHA"
          elif grep -q "already exists" <<<"$out"; then
            echo "refs/green-trees/$ID already recorded"
          else
            echo "::warning title=green tree not recorded::$(tr '\n' ' ' <<<"$out")"
          fi
