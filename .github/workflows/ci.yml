# Every PR (including forks) and every push to main. Runs on GitHub-hosted runners
# only and needs no secrets: game and mod downloads are unauthenticated.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Memo (docs/merge-queue.md): smoke, atlas, cairn and tools are a function
  # of the tree, and a passing pull_request run records its tree's id
  # (ci/code-tree.sh) as refs/green-trees/<id>. If this tree's id is already
  # on record there is nothing to learn from running them again. This is what
  # makes the merge queue cheap: the queue's temporary PR (main + everything
  # queued ahead + the PR) has exactly the tree the PR's own run tested
  # whenever the PR is built on the current main and queued alone, so the
  # queue merges on the PR's own result.
  #
  # A push to main consults the memo too, but only to skip the test-only jobs
  # (atlas, tools, units, site): smoke, cairn and export still run, because next.yml
  # publishes the dist, seraphhorizons-mod and recipe-export artifacts this run
  # produces. Tags and manual runs never consult it and run everything.
  #
  # Sliced PR runs (docs/merge-queue.md): a pull_request run whose tree is not
  # on record asks the planner (`ci/paths.py plan`) what the PR's change (the
  # merge commit against the main it merges into) needs run: which Atlas
  # shards (ci/atlas-shards.json, the matrix's one list), and whether smoke
  # (and with it export), cairn and site must. Every changed path must be
  # claimed by a rule that understands it, or the plan is the full suite. A
  # machine model PR runs only tools and units (the former models-only fast
  # path); a PR changing only Atlas scenario classes runs only the shards
  # whose filters select them. Never the merge queue's run (a
  # mergify/merge-queue/* branch), which tests the full suite before anything
  # lands, nor a push, tag, manual run or workflow_call: those always run the
  # full plan. A sliced run records no green tree.
  tree:
    name: Already tested?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      id: ${{ steps.tree.outputs.id }}
      tested: ${{ steps.tree.outputs.tested }}
      # The plan (`ci/paths.py outputs`), each 'true' or 'false'; a full plan
      # has every one true but `sliced`.
      sliced: ${{ steps.plan.outputs.sliced }}
      smoke: ${{ steps.plan.outputs.smoke }}
      cairn: ${{ steps.plan.outputs.cairn }}
      site: ${{ steps.plan.outputs.site }}
      atlas: ${{ steps.plan.outputs.atlas }}
      # {"include": [{shard, filter}, ...]}, the planned shards. Never empty
      # (GitHub rejects an empty matrix): with no shard planned it lists them
      # all, and `atlas` is false.
      atlas_matrix: ${{ steps.plan.outputs.atlas_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PR's merge commit and its first parent, the main it merges into:
          # their diff is what the PR changes, which the planner reads.
          fetch-depth: 2
      - id: tree
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          id=$(ci/code-tree.sh HEAD)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          main_push=false
          [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && main_push=true
          if [ "$EVENT" != pull_request ] && [ "$main_push" != true ]; then
            echo "tested=false" >> "$GITHUB_OUTPUT"
            echo "tree $id: $EVENT on $REF runs everything"
          elif by=$(gh api "repos/$REPO/git/ref/green-trees/$id" --jq .object.sha 2>/dev/null); then
            echo "tested=true" >> "$GITHUB_OUTPUT"
            if [ "$EVENT" = pull_request ]; then skipped="smoke, atlas, cairn, tools and units"; else skipped="atlas, tools, units and site"; fi
            echo "tree $id already passed CI (as $by); skipping $skipped" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "tested=false" >> "$GITHUB_OUTPUT"
            echo "tree $id: no passing CI on record"
          fi
      # The planner never fails (it plans the full suite for whatever it cannot
      # read), but should it crash, or print something that is not a plan, the
      # run is the full suite all the same.
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          TESTED: ${{ steps.tree.outputs.tested }}
        run: |
          plan="$RUNNER_TEMP/plan.json"
          if [ "$EVENT" != pull_request ] || [ "$TESTED" = true ]; then
            echo "$EVENT run (tree on record: $TESTED): the full plan"
          elif [[ "$HEAD_REF" == mergify/merge-queue/* ]]; then
            echo "merge queue run: the full suite, never sliced"
          elif [ "$(git rev-list --parents -n 1 HEAD | wc -w)" != 3 ]; then
            echo "no merge commit to diff: the full plan"
          elif python3 ci/paths.py plan HEAD^1 HEAD > "$plan" && jq -e 'has("sliced")' "$plan" >/dev/null; then
            jq . "$plan"
            if [ "$(jq .sliced "$plan")" = true ]; then
              {
                echo "### Sliced run (ci/paths.py plan)"
                jq -r '"Atlas shards: \(if .atlas == "all" then "all" elif .atlas == [] then "none" else (.atlas | join(", ")) end); smoke and export: \(.smoke); cairn: \(.cairn); site: \(.site)"' "$plan"
                jq -r '.reasons[] | "- " + .' "$plan"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning title=planner failed::running the full suite"
            rm -f "$plan"
          fi
          if [ -s "$plan" ]; then
            python3 ci/paths.py outputs "$plan" | tee -a "$GITHUB_OUTPUT"
          else
            python3 ci/paths.py outputs full | tee -a "$GITHUB_OUTPUT"
          fi

  # Never skipped by the memo: it is cheap, and `outdated` depends on the
  # ModDB rather than on the tree, so an old pass says nothing about today.
  lock:
    name: Lock is consistent
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: pack.toml and lock.json agree
        run: python3 tools/packtool.py check
      # README.md is a no-op path to the memo (ci/code-tree.sh), which is fine
      # here only because this job is never skipped.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
      - name: README's generated status line matches pack.toml
        run: |
          uvx --from cogapp==3.6.0 cog --check README.md \
            || { echo "::error file=README.md::out of date: run 'uvx --from cogapp==3.6.0 cog -r README.md' and commit"; exit 1; }
      - name: Locked releases still available on the ModDB (not retracted)
        run: python3 tools/packtool.py outdated

  smoke:
    name: Server boot + worldgen smoke test
    needs: [tree, lock]
    # On a push to main these run even for a tree on record: next.yml publishes
    # the recipe export (smoke), and dist and the seraphhorizons mod zip (cairn),
    # this run uploads. A sliced plan (only ever on a PR) may leave it out.
    if: (needs.tree.outputs.tested != 'true' || github.event_name != 'pull_request') && needs.tree.outputs.smoke == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pack
      # Smoke builds the pack's own mod (mods-src/seraphhorizons) and loads it in place of any
      # pinned copy, so the log scan and the export see it as this tree has it: its items, its
      # recipes and the schematics it gates recipes behind, which the item-values check in the
      # export job reads (#506).
      # --export also loads the CI-only export mod (tools/recipe-export), which dumps the
      # recipes and items the recipe browser shows. release.yml and next.yml publish it.
      # Both mods are staged in this run's Mods only; neither reaches build/mods, the lock or
      # assemble.
      # --config-defaults check: the pack's own mod runs in capture mode (it changes nothing in
      # ModConfig), and the run fails when what the mods wrote differs from the current pack
      # version's committed config defaults snapshot (docs/config-defaults.md; regenerate with
      # `packtool smoke --config-defaults write`). A released version's snapshot is frozen.
      - name: Boot dedicated server with the full pack
        run: >
          python3 tools/packtool.py smoke --data "$RUNNER_TEMP/smoke-data"
          --export "$RUNNER_TEMP/recipe-export/recipes.json"
          --config-defaults check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recipe-export
          path: ${{ runner.temp }}/recipe-export/recipes.json
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-logs
          path: |
            ${{ runner.temp }}/smoke-data/Logs/
            ${{ runner.temp }}/smoke-data/smoke-stdout.log
            ${{ runner.temp }}/smoke-data/ModConfig/

  atlas:
    name: Atlas pack scenarios (${{ matrix.shard }})
    needs: [tree, lock]
    if: needs.tree.outputs.tested != 'true' && needs.tree.outputs.atlas == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One job per shard of ci/atlas-shards.json, each a `dotnet test --filter` over the scenario
    # classes: Atlas runs one embedded server per process, so classes run in parallel only as
    # separate jobs, and every class pays its own server boot. Why each shard holds what it does,
    # and how to split one that grows, is ci/atlas-shards.md; tools/tests/test_ci_paths.py checks
    # that every test method is selected by exactly one shard. The `tree` job hands this job the
    # list, all of it unless a sliced PR run's plan (ci/paths.py plan) picked the shards whose
    # classes the PR changes.
    # Each shard's dotnet test run (compiling excluded: that is the step before it) must finish in
    # four and a half minutes or the shard fails (`Shard ran within its time limit`), so a growing
    # shard is split when it grows and not after it has crept up for months; aim for three and a half.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.tree.outputs.atlas_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pack
      # Local-only icon export mod (never shipped): keep it compiling, and test its logic.
      # Only on one shard, and not one of the longest (items, recipes): `rest`, which a sliced plan
      # keeps whenever these three steps' inputs change (REST_STEP_INPUTS in ci/paths.py).
      - name: Icon export mod builds and its unit tests pass
        if: matrix.shard == 'rest'
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
        run: |
          dotnet build tools/icon-export -c Release
          dotnet test tools/icon-export/tests --logger "console;verbosity=normal"
      # The local-only ore survey mod (tools/ore-survey, never shipped, like icon-export): keep it
      # compiling, and test its census flood (Core/). Its Python half is in the tools job's tools/tests.
      - name: Ore survey mod builds and its unit tests pass
        if: matrix.shard == 'rest'
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
        run: |
          dotnet build tools/ore-survey -c Release
          dotnet test tools/ore-survey/tests --logger "console;verbosity=normal"
      # GearConsumers (#473): every rusty gear use in the locked mods and the game is patched or
      # exempt. It needs the fetched mods and VINTAGE_STORY, which the tools job does not have
      # (there it skips), so it runs here as well.
      - name: Every rusty gear use is patched
        if: matrix.shard == 'rest'
        run: python3 -m unittest -v tools/tests/test_gear_consumers.py
      # Compiled in a step of its own so the time limit below measures only the scenarios: the
      # build costs every shard about the same and grows with no shard's classes.
      - name: dotnet build
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
        run: dotnet build tests/PackTests
      - name: Start the shard's clock
        run: echo "ATLAS_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: dotnet test
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
          FILTER: ${{ matrix.filter }}
          # TidyVariantsReportScenarios writes its report here, so it ships in atlas-results-tidy.
          TIDYVARIANTS_REPORT_DIR: ${{ runner.temp }}/atlas-results/tidyvariants
        # Console verbosity minimal: the game prints its whole server log to stdout, and at normal
        # the console logger relays it (~4,000 lines per booted class). Minimal still prints each
        # failure with its message, stack and output; every test's outcome and the server logs are
        # in the trx (atlas-results-*), and a failed class's own logs in atlas-scratch-*.
        run: >
          dotnet test tests/PackTests
          --no-build
          --filter "$FILTER"
          --logger "trx;LogFileName=atlas.trx"
          --logger "console;verbosity=minimal"
          --results-directory "$RUNNER_TEMP/atlas-results"
      # After a failed run too: a shard that both fails and runs long should say both.
      - name: Shard ran within its time limit
        if: always() && env.ATLAS_START != ''
        env:
          SHARD: ${{ matrix.shard }}
          LIMIT: "270"
        run: |
          elapsed=$(( $(date +%s) - ATLAS_START ))
          echo "$SHARD: dotnet test took ${elapsed}s (limit ${LIMIT}s)"
          if [ "$elapsed" -gt "$LIMIT" ]; then
            echo "::error title=Atlas shard over its time limit::$SHARD's dotnet test took ${elapsed}s, over ${LIMIT}s: split a class or the shard (ci/atlas-shards.md), or make its scenarios faster. Per-test times are in atlas-results-$SHARD."
            exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/atlas-results/
      # Atlas keeps a failed class's scratch world (incl. server-main.log) under $TMPDIR/atlas.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-scratch-${{ matrix.shard }}
          path: /tmp/atlas/*/Logs/
          if-no-files-found: ignore

  cairn:
    name: Cairn installs the pack
    needs: [tree, lock]
    # Runs on main even for a tree on record; see smoke.
    if: (needs.tree.outputs.tested != 'true' || github.event_name != 'pull_request') && needs.tree.outputs.cairn == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CAIRN_VERSION: "0.9.10"
      CAIRN_SHA256: b7a2b6359fb8c113e17854184c12b3a7703a26c784324152e17f5d84b850bf68
      CAIRN_HOME: /tmp/cairn-home
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # .NET and the game, to build the pack's own mod; also fetches the locked mods, which
      # assemble's server bundle takes its redistributable zips from.
      - uses: ./.github/actions/setup-pack
      # The pack's own mod as a release build makes it: build/seraphhorizons_<version>.zip,
      # the version modinfo.json says, never stamped. next ships it under the commit's name,
      # seraphhorizons_next_<sha7>.zip, which next.yml publishes in the next
      # release beside the Cairn pack below, which fetches it from there. Cairn
      # sees a followed pack change by its mods' addresses and versions, never their hashes,
      # so a rebuild under an unchanged name would never reach a follower. The name is keyed
      # on the commit built, not the last one touching the mod: the zip holds build-time
      # file times, so every build has a new hash, and one name must never serve two.
      - name: Build the seraphhorizons mod zip
        id: mod
        run: |
          dotnet build mods-src/seraphhorizons -c Release
          version=$(jq -r .version mods-src/seraphhorizons/modinfo.json)
          built="build/seraphhorizons_${version}.zip"
          [ -f "$built" ] || { echo "the build wrote no $built"; exit 1; }
          zip="$RUNNER_TEMP/next-mod/seraphhorizons_next_${GITHUB_SHA::7}.zip"
          mkdir -p "${zip%/*}" && cp "$built" "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
      # This dist is what next.yml publishes as next, so its Cairn pack carries the mod by
      # address (the URL is where next.yml puts this very zip; versioned releases assemble
      # their own dist, naming the release's own copy, release.yml). Built the same on every run, PRs included,
      # so the install below tests what next ships. Its files are named for next, not the
      # version (seraphhorizons_next.cairn, ...); their contents keep the version.
      - name: Assemble release artifacts
        env:
          ZIP: ${{ steps.mod.outputs.zip }}
        run: >
          python3 tools/packtool.py assemble --label next --url-mod "$ZIP"
          "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/next/${ZIP##*/}"
      # cairn-server is source-available (PolyForm Strict + a run-for-any-purpose grant);
      # we download and run it, never redistribute it.
      - name: Download cairn-server ${{ env.CAIRN_VERSION }}
        run: |
          f="cairn-${CAIRN_VERSION}-linux-x64-server.tar.gz"
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/$f" "https://download.cairns.gg/releases/${CAIRN_VERSION}/$f"
          echo "$CAIRN_SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cairn" && tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/cairn"
      # The mod's URL, named after this commit, serves nothing until next.yml publishes this
      # zip there, so the install reads a copy of the pack whose address-mods point at this
      # zip served on loopback, plain http to which Cairn allows. The copy differs from
      # dist/ in those addresses only; the lock, and so the hash Cairn holds the zip to, is
      # the one that ships.
      - name: cairn-server install (resolves, downloads, sha256-verifies every mod)
        env:
          ZIP: ${{ steps.mod.outputs.zip }}
        run: |
          id=$(jq -r .pack.id pack/lock.json)
          port=8765
          python3 -m http.server "$port" --bind 127.0.0.1 --directory "$(dirname "$ZIP")" >/dev/null 2>&1 &
          srv=$!
          trap 'kill "$srv"' EXIT
          for _ in $(seq 50); do curl -fsI "http://127.0.0.1:$port/${ZIP##*/}" >/dev/null && break; sleep 0.2; done
          jq --arg base "http://127.0.0.1:$port/" \
            '.pack.mods |= map(if .url then .url = $base + (.url | split("/") | last) else . end)' \
            "dist/${id}_next.cairn" > "$RUNNER_TEMP/${id}.cairn"
          "$RUNNER_TEMP/cairn/cairn-server" install "$RUNNER_TEMP/${id}.cairn"
      - name: Cairn's lock matches ours, and the mod it fetched by address is this build
        env:
          ZIP: ${{ steps.mod.outputs.zip }}
        run: |
          id=$(jq -r .pack.id pack/lock.json)
          # The pack file's lock is lock.json's mods with the address mods in place of any ModDB pin of the same modid (packtool tests).
          diff <(jq -S '[.lock.mods[] | {id: .modid, version, sha256}] | sort_by(.id)' "dist/${id}_next.cairn") \
               <(jq -S '[.mods[] | {id: .modid, version, sha256}] | sort_by(.id)' "$CAIRN_HOME/packs/$id/pack.lock.json")
          echo "$(sha256sum < "$ZIP" | cut -d' ' -f1)  $CAIRN_HOME/packs/$id/Mods/${ZIP##*/}" | sha256sum -c -
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
      # The zip dist's Cairn pack names by hash; next.yml publishes the two together, in next.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seraphhorizons-mod
          path: ${{ steps.mod.outputs.zip }}
          if-no-files-found: error

  tools:
    name: Tool and site unit tests
    needs: tree
    if: needs.tree.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            tools/site-data/package-lock.json
            site/package-lock.json
      # The icon import tests need Pillow; without it they skip and prove nothing.
      - name: Python tool tests
        run: |
          python3 -m pip install --quiet pillow
          python3 -m unittest discover -s tools/tests -v
      # Works on the LFS pointer files this checkout has: no image is downloaded.
      - name: Icon index matches the icon files
        run: python3 tools/icons.py verify
      - name: Texture index matches the texture files
        run: python3 tools/textures.py verify
      - name: tools/site-data
        run: |
          npm ci --prefix tools/site-data
          npm --prefix tools/site-data run typecheck
          npm --prefix tools/site-data test
      - name: site
        run: |
          npm ci --prefix site
          npm --prefix site run check
          npm --prefix site test

  # The game-independent code of the pack's own mod (Tidy Variants' rule engine,
  # the machines' rig maths, each feature's Core/): unit tests that need neither
  # the game nor the pack, so they run apart from Atlas, and on every sliced
  # run: on a machine model PR's they hold its rig to its reference poses.
  units:
    name: Seraph Horizons unit tests
    needs: tree
    if: needs.tree.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: dotnet test mods-src/seraphhorizons/tests
        run: dotnet test mods-src/seraphhorizons/tests --logger "console;verbosity=normal"

  export:
    name: Recipe export is valid
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/site-data/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recipe-export
          path: ${{ runner.temp }}/recipe-export
      - name: Export matches the schema and its cross-references hold
        run: |
          npm ci --prefix tools/site-data
          npm --prefix tools/site-data run build
          node tools/site-data/dist/bin.js validate "$RUNNER_TEMP/recipe-export/recipes.json"
      # Item values (#449, #506, #523): the table the mod ships equals a rebuild from this export
      # (which has the mod's own items and schematic gates: smoke loads this tree's build), every
      # item the pack's traders buy (their buying sides and player-supplied goods) has a base value,
      # and no trade list names a retired item nothing values. On drift it prints the changed codes
      # and the rebuild command; rebuild from this run's recipe-export artifact.
      - name: Item values table is current and items traders buy have values
        run: python3 tools/item-values/itemvalues.py check "$RUNNER_TEMP/recipe-export/recipes.json"
      # Warns about items without an icon; never fails for them (the site shows placeholders).
      - name: Icon drift
        run: python3 tools/icons.py drift --export "$RUNNER_TEMP/recipe-export/recipes.json"
      # Warns about textures the eidolon section names that textures/ lacks (drawn as colours).
      - name: Texture drift
        run: python3 tools/textures.py drift --export "$RUNNER_TEMP/recipe-export/recipes.json"

  site:
    name: Recipe browser end to end
    needs: [tree, smoke]
    # On a push to main smoke runs for its artifact alone; the site itself is
    # a function of the tree, so a tree on record skips this. A sliced plan
    # may leave it out (one that keeps it keeps smoke, whose export it reads).
    if: needs.tree.outputs.tested != 'true' && needs.tree.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recipe-export
          path: ${{ runner.temp }}/recipe-export
      - run: npm ci --prefix site
      - run: npx --prefix site playwright install --with-deps chromium
      # Against the export this run's server dumped, not a fixture.
      - name: Playwright
        env:
          RECIPE_EXPORT: ${{ runner.temp }}/recipe-export/recipes.json
        run: npm --prefix site run e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-e2e
          path: |
            site/e2e/.work/results/
            site/playwright-report/
          if-no-files-found: ignore

  # Keeps the icons' (and textures/', the same kind of store) LFS objects in
  # the Actions cache for pages.yml. That
  # workflow is started by workflow_run, which gets a read-only cache, so it
  # cannot save one itself; without a cache every deploy downloads all the
  # icons, and each download counts against the LFS bandwidth quota. Here LFS
  # is touched only when icons/index.json has changed, and then only for the
  # icons that are new. Not in ci-ok: a cold cache costs bandwidth, not
  # correctness.
  icons:
    name: Icon cache for the site deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-icons-${{ hashFiles('icons/index.json', 'textures/index.json') }}
          restore-keys: lfs-icons-
      - name: Fetch the icons and textures the cache does not hold
        if: steps.cache.outputs.cache-hit != 'true'
        run: git lfs fetch origin "$GITHUB_SHA" --include "icons/**,textures/**"

  # The one required status check (branch protection and .mergify.yml). A
  # needed job that fails leaves a plain `needs:` job *skipped*, and GitHub and
  # Mergify both read a skipped required check as passing, so this runs
  # always() and passes only if every job above succeeded. The skips it
  # accepts, job by job, are those `tree` decided on: the memoised jobs
  # standing down because the tree is already on record as green (on a PR
  # export needs smoke, so it is skipped with it; on a push to main smoke,
  # cairn and export still run), and the jobs a sliced plan left out (smoke
  # and with it export, atlas when it planned no shard, cairn, site). tools
  # and units only ever stand down for the memo. A sliced atlas run is one
  # result over the shards the plan picked, and passes when they all did.
  # A new job gets a `check` line naming what may skip it, or none.
  ci-ok:
    if: always()
    needs: [tree, lock, smoke, atlas, cairn, tools, units, export, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # contents: write is for the record step (a ref under refs/green-trees/,
    # nothing on any branch). release.yml grants it to its call of this
    # workflow for the same reason.
    permissions:
      contents: write
    steps:
      - name: Every CI job succeeded
        env:
          TREE: ${{ needs.tree.result }}
          LOCK: ${{ needs.lock.result }}
          SMOKE: ${{ needs.smoke.result }}
          ATLAS: ${{ needs.atlas.result }}
          CAIRN: ${{ needs.cairn.result }}
          TOOLS: ${{ needs.tools.result }}
          UNITS: ${{ needs.units.result }}
          EXPORT: ${{ needs.export.result }}
          SITE: ${{ needs.site.result }}
          TESTED: ${{ needs.tree.outputs.tested }}
          SLICED: ${{ needs.tree.outputs.sliced }}
          # What the plan left out, each 'true' only when `tree` said so.
          NO_SMOKE: ${{ needs.tree.outputs.smoke == 'false' }}
          NO_ATLAS: ${{ needs.tree.outputs.atlas == 'false' }}
          NO_CAIRN: ${{ needs.tree.outputs.cairn == 'false' }}
          NO_SITE: ${{ needs.tree.outputs.site == 'false' }}
        run: |
          echo "already tested: $TESTED; sliced: $SLICED (left out: smoke $NO_SMOKE, atlas $NO_ATLAS, cairn $NO_CAIRN, site $NO_SITE)"
          fail=0
          # check <job> <result> [<skip accepted if this is true>...]
          check() {
            local job=$1 result=$2 why
            shift 2
            if [ "$result" = success ]; then echo "$job: success"; return; fi
            if [ "$result" = skipped ]; then
              for why in "$@"; do [ "$why" = true ] && { echo "$job: skipped"; return; }; done
            fi
            echo "::error::$job: $result"
            fail=1
          }
          check tree "$TREE"
          check lock "$LOCK"
          check smoke "$SMOKE" "$TESTED" "$NO_SMOKE"
          check atlas "$ATLAS" "$TESTED" "$NO_ATLAS"
          check cairn "$CAIRN" "$TESTED" "$NO_CAIRN"
          check export "$EXPORT" "$TESTED" "$NO_SMOKE"
          check site "$SITE" "$TESTED" "$NO_SITE"
          check tools "$TOOLS" "$TESTED"
          check units "$UNITS" "$TESTED"
          exit "$fail"
      # Everything ran and passed: put this tree's id on record (the memo
      # `tree` reads). The ref points at the commit that was tested, on a
      # pull_request event GitHub's merge commit (refs/pull/N/merge), which
      # also keeps it around for auditing. "Reference already exists" (a
      # re-run, or another PR with the same tree got there first) is the same
      # outcome. Anything else is a warning, not a failure: a missed record
      # costs one redundant run, never a wrong merge. Fork PRs have a
      # read-only token and just don't record. A sliced run left part of the
      # suite out, so it vouches for nothing and records nothing.
      - name: Record green tree
        if: github.event_name == 'pull_request' && needs.tree.outputs.tested != 'true' && needs.tree.outputs.sliced == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ID: ${{ needs.tree.outputs.id }}
          SHA: ${{ github.sha }}
        run: |
          if out=$(gh api -X POST "repos/$REPO/git/refs" -f ref="refs/green-trees/$ID" -f sha="$SHA" 2>&1); then
            echo "recorded refs/green-trees/$ID -> $SHA"
          elif grep -q "already exists" <<<"$out"; then
            echo "refs/green-trees/$ID already recorded"
          else
            echo "::warning title=green tree not recorded::$(tr '\n' ' ' <<<"$out")"
          fi
