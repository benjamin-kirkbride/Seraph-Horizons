# Builds the recipe browser from the recipe export of every release and deploys it
# to GitHub Pages. Runs after release.yml or next.yml has published, because a
# release created with the default token triggers no workflow of its own. Needs the
# repository's Pages source set to "GitHub Actions" (docs/recipe-browser/deploy.md).
name: Pages

on:
  workflow_run:
    workflows: [Release, Next release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, never cancelled half-way; a queued run picks up every
# release published meanwhile.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Not for forks, and only after a publish that succeeded. workflow_run always
    # runs on main here, never on a pull request's code.
    if: >
      github.repository == 'benjamin-kirkbride/Seraph-Horizons'
      && (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
          || github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read # configure-pages reads the site's base path
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The only job that fetches LFS: the icons. Every download counts against the LFS
      # bandwidth quota, so the objects are cached and only new icons are fetched.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-icons-${{ hashFiles('icons/index.json') }}
          restore-keys: lfs-icons-
      - name: Fetch the icons
        run: git lfs pull --include "icons/**"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            tools/site-data/package-lock.json
            site/package-lock.json
      - name: Build tools/site-data
        run: |
          npm ci --prefix tools/site-data
          npm --prefix tools/site-data run build
      - name: Download the recipe export of every release
        run: node tools/site-data/dist/bin.js fetch --repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/releases"
      - name: Validate, migrate and collect the exports
        run: node tools/site-data/dist/bin.js assemble --releases "$RUNNER_TEMP/releases" --out "$RUNNER_TEMP/data"
      - name: Prepare each version's data for the app
        run: |
          npm ci --prefix site
          mkdir -p site/public/data
          # npm --prefix runs the script from site/, so every path is absolute.
          for id in $(jq -r '.versions[].id' "$RUNNER_TEMP/data/versions.json"); do
            npm --prefix site run prepare-data -- \
              --export "$RUNNER_TEMP/data/$id/export.json" --out "$GITHUB_WORKSPACE/site/public/data/$id"
          done
          cp "$RUNNER_TEMP/data/versions.json" site/public/data/versions.json
      - name: Copy the icons
        run: |
          if [ ! -f icons/index.json ]; then
            echo "::warning::icons/index.json is missing; the site is built without icons"
            exit 0
          fi
          # A failed LFS fetch leaves pointer files, which would deploy as broken images.
          if grep -rq --include='*.png' '^version https://git-lfs' icons; then
            echo "::error::icons/ holds LFS pointer files, not images"
            exit 1
          fi
          mkdir -p site/public/icons
          cp -R icons/. site/public/icons/
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build the site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm --prefix site run build
      - name: Size against the Pages limit
        run: node tools/site-data/dist/bin.js size site/dist
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
