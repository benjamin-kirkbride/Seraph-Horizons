<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Unofficial recipe browser for the Seraph Horizons Vintage Story modpack." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>Seraph Horizons recipes</title>
    <script>
      // The saved theme, before first paint; see src/lib/theme.ts.
      try {
        var theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>This recipe browser needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
